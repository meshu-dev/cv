name: Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify CI passed for this commit
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(gh run list \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --json databaseId \
            --jq length)

          if [ "$count" -eq 0 ]; then
            echo "::error::No successful CI run found for commit $GITHUB_SHA. Wait for CI to pass, then push the tag again."
            exit 1
          fi

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [verify-ci]
    environment:
      name: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
        env:
          PORTFOLIO_API_EMAIL: ${{ secrets.PORTFOLIO_API_EMAIL }}
          PORTFOLIO_API_PASSWORD: ${{ secrets.PORTFOLIO_API_PASSWORD }}
          PUBLIC_PORTFOLIO_API_URL: ${{ vars.PUBLIC_PORTFOLIO_API_URL }}
          PUBLIC_GOOGLE_RECAPTCHA_KEY: ${{ vars.PUBLIC_GOOGLE_RECAPTCHA_KEY }}
          PUBLIC_GOOGLE_RECAPTCHA_URL: ${{ vars.PUBLIC_GOOGLE_RECAPTCHA_URL }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
